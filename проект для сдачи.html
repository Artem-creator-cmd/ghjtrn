// --- ИСПРАВЛЕННЫЕ ФУНКЦИИ ИНДИКАТОРОВ ---
function calculateEMA(prices, period) {
    if(prices.length === 0) return 0;
    const k = 2 / (period + 1);
    let ema = prices[0];
    for(let i = 1; i < prices.length; i++) ema = prices[i] * k + ema * (1 - k);
    return ema;
}

function calculateRSI(prices, period=14) {
    if(prices.length < period+1) return 50;
    let gains=0, losses=0;
    for(let i=prices.length-period; i<prices.length-1; i++) {
        let diff = prices[i+1]-prices[i];
        if(diff>=0) gains+=diff; else losses-=diff;
    }
    let avgGain=gains/period, avgLoss=losses/period;
    if(avgLoss===0) return 100;
    return 100 - (100/(1+avgGain/avgLoss));
}

// --- ИСПРАВЛЕННАЯ ФУНКЦИЯ MACD ---
function calculateMACD(prices, fast=12, slow=26, signal=9) {
    if (prices.length < slow) return { macd: "—", signal: "—", histogram: "—" };

    const kFast = 2 / (fast + 1);
    const kSlow = 2 / (slow + 1);

    let emaFast = prices[0];
    let emaSlow = prices[0];

    const macdLineValues = [];

    for (let i = 1; i < prices.length; i++) {
        emaFast = prices[i] * kFast + emaFast * (1 - kFast);
        emaSlow = prices[i] * kSlow + emaSlow * (1 - kSlow);
        
        const macdValue = emaFast - emaSlow;
        
        macdLineValues.push(macdValue);
        
        if (macdLineValues.length >= signal) {
            const signalLineEMA = calculateEMA(macdLineValues.slice(-signal), signal);
            return {
                macd: macdValue.toFixed(2),
                signal: signalLineEMA.toFixed(2),
                histogram: (macdValue - signalLineEMA).toFixed(2)
            };
        }
    }
    
    return {
        macd: macdLineValues[macdLineValues.length - 1]?.toFixed(2) || "—",
        signal: "—",
        histogram: "—"
    };
}
